<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - SmartBank</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="navbar">
        <div class="brand">Smart<span>Bank</span> <span class="muted" style="color: #dce6ff; font-size: 0.8rem; ">Staff</span></div>
        <nav>
            <span id="whoami" style="color: #dce6ff;"></span>
            <button class="linklike" onclick="logout()">Log Out</button>
        </nav>
    </div>

    <div class="container">
        <div class="card">
            <h2>Select Service Counter</h2>
            <div class="tabs" id="serviceTabs"></div>
        </div>
        <div class="grid grid-2">
            <div class="card">
                <h3>Now Serving / Called</h3>
                <div id="inProgressList"><p class="muted">Nothing in progress.</p></div>
            </div>
            <div class="card">
                <h3>Up Next</h3>
                <div class="ticket-number" id="nextNumber">-</div>
                <p class="muted"><span id="waitingCount">0</span> waiting in this line</p>
                <button class="btn" id="callNextBtn"> Call Next Customer</button>
            </div>
        </div>

        <div class="card">
            <h3>Waiting Line</h3>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Ticket</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                    <tbody id="waitingBody"></tbody>
            </table>
        </div>
    </div>
    
<script src="js/api.js"></script>
<script>
    const user = requireRole("staff", "admin");
    document.getElementById("whoami").textContent = user ? `${user.username}` : "";

    let services = [];
    let activeServiceId = null;
    let currentInProgress = [];

    async function loadServices() {
    const { services: list } = await apiRequest("/services", { auth: false });
    services = list;
    const tabWrap = document.getElementById("serviceTabs");
    tabWrap.innerHTML = "";
    list.forEach((s, idx) => {
        const btn = document.createElement("button");
        btn.className = "tab-btn" + (idx === 0 ? " active" : "");
        btn.textContent = s.service_name;
        btn.onclick = () => selectService(s.service_id, btn);
        tabWrap.appendChild(btn);
    });
    if (list.length) {
        activeServiceId = list[0].service_id;
        refresh();
    }
    }

    function selectService(id, btn) {
    activeServiceId = id;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    refresh();
    }

    async function refresh() {
    if (!activeServiceId) return;
    const data = await apiRequest(`/queue/service/${activeServiceId}`);
    currentInProgress = data.inProgress;

    document.getElementById("waitingCount").textContent = data.waitingCount;
    document.getElementById("nextNumber").textContent = data.waiting[0] ? data.waiting[0].queueNumber : "-";
    document.getElementById("callNextBtn").disabled = data.waitingCount === 0;

    const wbody = document.getElementById("waitingBody");
    wbody.innerHTML = "";
    data.waiting.forEach(w => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${w.position}</td><td><strong>${w.queueNumber}</strong></td><td>${w.customerName}</td>
        <td>${w.phone || "-"}</td><td>${fmtTime(w.joinedAt)}</td>`;
        wbody.appendChild(tr);
    });

    const ipDiv = document.getElementById("inProgressList");
    if (!data.inProgress.length) {
        ipDiv.innerHTML = `<p class="muted">Nothing in progress.</p>`;
    } else {
        ipDiv.innerHTML = "";
        data.inProgress.forEach(t => {
        const row = document.createElement("div");
        row.style.marginBottom = "12px";
        row.innerHTML = `
            <div><strong>${t.queue_number}</strong> — ${t.username} &nbsp; <span class="badge ${t.status}">${t.status}</span></div>
            <div style="margin-top:6px;">
            ${t.status === "Called" ? `<button class="btn success" data-action="start" data-id="${t.queue_id}">Start Service</button>
            <button class="btn secondary" data-action="absent" data-id="${t.queue_id}">Mark Absent</button>` : ""}
            ${t.status === "InService" ? `<button class="btn" data-action="complete" data-id="${t.queue_id}">Complete</button>` : ""}
            <button class="btn danger" data-action="skip" data-id="${t.queue_id}">Skip</button>
            </div>`;
        ipDiv.appendChild(row);
        });
        ipDiv.querySelectorAll("button[data-action]").forEach(btn => {
        btn.addEventListener("click", () => handleAction(btn.dataset.action, btn.dataset.id));
        });
    }
    }

    document.getElementById("callNextBtn").addEventListener("click", async () => {
    try {
        await apiRequest(`/queue/service/${activeServiceId}/call-next`, { method: "POST" });
        refresh();
    } catch (err) {
        alert(err.message);
    }
    });

    async function handleAction(action, ticketId) {
    try {
        await apiRequest(`/queue/${ticketId}/${action}`, { method: "POST" });
        refresh();
    } catch (err) {
        alert(err.message);
    }
    }

    loadServices();
    setInterval(refresh, 8000);
</script>
    
</body>
</html>
