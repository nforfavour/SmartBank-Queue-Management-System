services:
  - type: web
    name: smartbank-queue-system
    env: docker
    plan: free

    envVars:
      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 8h

      - key: STAFF_SIGNUP_CODE
        sync: false

      - key: ADMIN_SIGNUP_CODE
        sync: false

      - key: BREVO_API_KEY
        sync: false

      - key: BREVO_SENDER_EMAIL
        sync: false

      - key: BREVO_SENDER_NAME
        value: SmartBank
